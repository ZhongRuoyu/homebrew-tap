name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        type: number
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pull_request }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash -euxo pipefail {0}

env:
  GH_REPO: ${{ github.repository }}
  PR: ${{ inputs.pull_request }}

jobs:
  check-pr:
    name: Check PR info
    runs-on: ubuntu-latest
    outputs:
      remote: ${{ steps.check-pr.outputs.remote }}
      remote_branch: ${{ steps.check-pr.outputs.remote_branch }}
      head_sha: ${{ steps.check-pr.outputs.head_sha }}
    steps:
      - name: Check PR info
        id: check-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_data="$(
            gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GH_REPO/pulls/$PR"
          )"

          remote="$(jq --raw-output .head.repo.clone_url <<< "$pr_data")"
          remote_branch="$(jq --raw-output .head.ref <<< "$pr_data")"
          head_sha="$(jq --raw-output .head.sha <<< "$pr_data")"

          if [[ -z "$remote" ]] ||
             [[ -z "$remote_branch" ]] ||
             [[ -z "$head_sha" ]]
          then
            echo "::error ::Failed to get PR data!"
            exit 1
          fi

          {
            echo "remote=$remote"
            echo "remote_branch=$remote_branch"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

  pr-pull:
    name: brew pr-pull
    needs: check-pr
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:main # zizmor: ignore[unpinned-images]
    permissions:
      actions: read # for `brew pr-pull`
      artifact-metadata: write # for generating build provenance
      attestations: write # for generating build provenance
      checks: read # for `brew pr-pull`
      contents: write # for pushing bottle commits
      id-token: write # for generating build provenance
      issues: read # for `brew pr-pull`
      packages: write # for uploading bottles
      pull-requests: write # for managing PR
    environment:
      name: github
      deployment: false
    defaults:
      run:
        shell: bash -euxo pipefail {0}
        working-directory: /github/home
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1

      - name: Configure Git user
        uses: Homebrew/actions/git-user-config@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          username: zhongruoyu-commit-app[bot]

      - name: Checkout PR branch
        id: checkout-pr
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr checkout "$PR"
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pull bottles
        id: brew-pr-pull
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          EXPECTED_SHA: ${{ needs.check-pr.outputs.head_sha }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
        run: |
          local_git_head="$(git rev-parse HEAD)"
          remote_git_head="$(git ls-remote origin "pull/$PR/head" | cut -f1)"

          if [ "$local_git_head" != "$EXPECTED_SHA" ] ||
             [ "$remote_git_head" != "$EXPECTED_SHA" ]
          then
            echo "::error ::Unexpected change in target branch."
            echo "::error ::Expected SHA1    $EXPECTED_SHA"
            echo "::error ::Checked out SHA1 $local_git_head"
            echo "::error ::PR branch SHA1   $remote_git_head"
            exit 1
          fi

          brew pr-pull \
            --debug \
            --clean \
            --no-cherry-pick \
            --tap="$GH_REPO" \
            --workflows=tests.yml \
            --retain-bottle-dir \
            "$PR"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.brew-pr-pull.outputs.bottle_path }}/*.tar.gz

      - name: Generate push token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.ZHONGRUOYU_COMMIT_APP_ID }}
          private-key: ${{ secrets.ZHONGRUOYU_COMMIT_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Push commits
        uses: Homebrew/actions/git-try-push@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
          remote: ${{ needs.check-pr.outputs.remote }}
          branch: ${{ steps.checkout-pr.outputs.branch }}
          remote_branch: ${{ needs.check-pr.outputs.remote_branch }}

      - name: Add CI-published-bottle-commits label
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit --add-label="CI-published-bottle-commits" "$PR"

      - name: Wait until PR branch is in sync with local repository
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          EXPECTED_SHA: ${{ steps.brew-pr-pull.outputs.head_sha }}
        run: |
          max_attempts=10
          attempt=0
          timeout=1

          # Wait (with exponential backoff) until the PR branch is in sync
          while [[ "$attempt" -lt "$max_attempts" ]]
          do
            remote_head="$(git ls-remote origin "pull/$PR/head" | cut -f1)"
            if [[ "$remote_head" = "$EXPECTED_SHA" ]]
            then
              success=1
              break
            fi
            echo "Remote repository not in sync. Checking again in ${timeout}s..."
            sleep "$timeout"
            attempt=$(( attempt + 1 ))
            timeout=$(( timeout * 2 ))
          done

          if [[ -z "$success" ]] &&
             [[ "$(git ls-remote origin "pull/$PR/head" | cut -f1)" != "$EXPECTED_SHA" ]]
          then
            echo "::error::Remote repository is not in sync with local repository."
            exit 1
          fi

      - name: Enable automerge
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_SHA: ${{ steps.brew-pr-pull.outputs.head_sha }}
        run: |
          gh pr merge \
            --auto \
            --merge \
            --delete-branch \
            --match-head-commit="$EXPECTED_SHA" \
            "$PR"
